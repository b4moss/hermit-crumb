# Publishes @b4moss/hermit-crumb when a tagged commit is on `release`
# and package.json version matches the tag.
#
# Intended flow:
# 1. Tag on main (e.g. v0.1.0)
# 2. Create a GitHub Release from that tag
# 3. Merge / push the same tagged commit onto `release`
# → this workflow publishes to npm
#
# See docs/publishing.md.

name: npm publish

on:
  push:
    branches:
      - release
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish @b4moss/hermit-crumb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve version tag and release branch
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin release:refs/remotes/origin/release

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            case "$TAG" in
              v*) ;;
              *)
                echo "Release tag must be v* (got: $TAG) — skip"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            COMMIT="$(git rev-list -n 1 "$TAG")"
            if ! git merge-base --is-ancestor "$COMMIT" origin/release; then
              echo "Tag $TAG ($COMMIT) is not on origin/release yet — skip publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAGS="$(git tag --points-at "$SHA" 'v*' || true)"
            if [ -z "$TAGS" ]; then
              echo "No v* tag points at $SHA — skip publish (tag + release branch required)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="$(printf '%s\n' $TAGS | sort -V | tail -n1)"
            COMMIT="$SHA"
          fi

          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/hermit-crumb/package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (package $PKG_VERSION) from $COMMIT"

      - name: Setup Node.js
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.tag.outputs.skip != 'true'
        run: npm ci

      - name: Build package
        if: steps.tag.outputs.skip != 'true'
        run: npm run build -w @b4moss/hermit-crumb

      - name: Guard against re-publish
        id: guard
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          if npm view "@b4moss/hermit-crumb@$VERSION" version >/dev/null 2>&1; then
            echo "@b4moss/hermit-crumb@$VERSION already on npm — skip (idempotent)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION is not on npm yet — ok to publish."

      - name: Publish
        if: steps.tag.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: npm publish -w @b4moss/hermit-crumb --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
