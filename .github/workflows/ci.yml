name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev-v0.1.0
      - release
      - 'cursor/**'
  pull_request:
    branches:
      - main
      - develop
      - dev-v0.1.0
      - release

jobs:
  check:
    name: lint / typecheck / build / test / smoke / generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Test package
        run: npm run test

      - name: Smoke create (file: link + nuxt prepare)
        run: npm run smoke:create

      - name: Generate playground
        run: npm run generate:playground
