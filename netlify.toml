# Netlify publishes the playground from GitHub Actions
# (`.github/workflows/doc-site.yml`) after playground tests pass.
# Skip automatic Git-triggered builds to avoid duplicate deploys.
# Disable auto builds in the Netlify UI as well if still enabled.

[build]
  command = "npm ci && npm run typecheck:playground && npm run generate:playground"
  publish = "playground/.output/public"
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22.19"
